# ═══════════════════════════════════════════════════════════════════
#  SELF-HOSTED PRODUCTION STACK — Docker Compose
#
#  Usage (Linux VPS):
#    cp .env.example .env      # fill values (install.sh can help)
#    docker compose -f docker-compose.prod.yml up -d
#    → open http://<host>/setup (HTTPS once a domain is configured)
#
#  Design notes:
#  - ONE application image serves all roles (app, worker, scheduler,
#    realtime) with different commands — no duplicate images.
#  - Only Caddy publishes ports (80/443). PostgreSQL and Redis are on
#    internal-only networks and are never host-published.
#  - Named volumes keep PostgreSQL, Redis, uploads and Caddy certificates
#    across container recreation.
#  - Development-only tools (pgAdmin, Mailpit) are NOT part of this stack.
# ═══════════════════════════════════════════════════════════════════

name: backend-plane

networks:
  # NOTE: no fixed network/volume names — Compose prefixes them with the
  # project name (COMPOSE_PROJECT_NAME or directory), so multiple independent
  # installations never share a database volume (26.1C.3 repeatability fix).
  proxy:
  application:
  database:
    internal: true

volumes:
  pgdata:
  redisdata:
  app_storage:
  caddy_data:
  caddy_config:

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  build:
    context: .
    dockerfile: infrastructure/docker/prod/Dockerfile
  image: backend-plane/app-php:8.4
  restart: unless-stopped
  env_file: [.env]
  working_dir: /var/www/html
  volumes:
    - app_storage:/var/www/html/storage/app
    - ./backups/data:/backups
  networks:
    - application
    - database
  logging: *default-logging

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 1536m
    env_file: [.env]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-UTC}
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./scripts/postgres:/scripts/postgres:ro
      - ./backups/scripts:/scripts/backups:ro
      - ./backups/data:/backups
    networks:
      - database
    # NOTE: no `ports:` — PostgreSQL is never host-published.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    mem_limit: 512m
    env_file: [.env]
    command: ["redis-server", "/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data
      - ./infrastructure/redis/redis.conf:/etc/redis/redis.conf:ro
    networks:
      - database
      - application
    # NOTE: no `ports:` — Redis is never host-published.
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  # One-shot schema migration — application roles start only after it passes.
  migrate:
    <<: *app
    restart: "no"
    command: ["php", "artisan", "migrate", "--force"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true

  # One-shot frontend asset publish. Filament's compiled CSS/JS/fonts are
  # generated artifacts (gitignored: public/{css,js,fonts}/filament), and
  # Caddy serves the edge docroot from the host public/ bind mount — so the
  # generated assets must be written into that docroot on every deploy. The
  # same assets are baked into the image at build time (Dockerfile), keeping
  # the image self-contained for deployments that do not use this bind mount.
  assets:
    <<: *app
    restart: "no"
    command: ["php", "artisan", "filament:assets"]
    volumes:
      - ./apps/owner-console/public:/var/www/html/public
    healthcheck:
      disable: true

  app:
    <<: *app
    mem_limit: 768m
    depends_on:
      migrate:
        condition: service_completed_successfully
      assets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "sh", "/usr/local/bin/fpm-healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 15s

  horizon:
    <<: *app
    command: ["php", "artisan", "horizon"]
    # Run the queue worker as the SAME uid as php-fpm (www-data): the agent
    # runtime creates git worktrees from web requests and computes changesets
    # from queue jobs — one owner means git never hits dubious-ownership
    # refusals and opencode shares file ownership with every PHP writer.
    user: "82:82"
    # 1g: the Phase 43 `agents` supervisor adds resident workers to the
    # default fleet; 512m OOM-killed horizon on the VPS (dogfood finding).
    mem_limit: 1g
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status | grep -qi running"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    mem_limit: 256m
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'schedule:work' >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  reverb:
    <<: *app
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=6001"]
    mem_limit: 256m
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6001"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Phase 43 — managed OpenCode agent runtime. INTERNAL ONLY: no `ports:`,
  # never routed through Caddy, never host-published. It shares the app's
  # storage volume so it sees exactly TEMM's isolated task-workspace root at
  # the SAME absolute path as the app containers (`?directory=` consistency).
  # If you bind-mount client repos into `app` for agent tasks, mount them
  # here too at identical paths — never wider than that.
  opencode:
    # Opt-in only for operators explicitly choosing Nexus Developer Agent.
    # The company's coding agents run on the local workstation instead.
    # Default production 'docker compose up -d' does not start this service.
    profiles: ["managed-developer-agent"]
    build:
      # Context is the opencode folder itself: COPY paths inside the
      # Dockerfile (entrypoint.sh) are context-relative.
      context: ./infrastructure/docker/opencode
      dockerfile: Dockerfile
      args:
        OPENCODE_VERSION: ${OPENCODE_VERSION:-1.18.34}
    image: backend-plane/opencode:${OPENCODE_VERSION:-1.18.34}
    restart: unless-stopped
    mem_limit: 1g
    env_file: [.env]
    environment:
      TZ: ${TZ:-UTC}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?set OPENCODE_SERVER_PASSWORD in .env}
      # Model-provider credentials, passed through only when defined.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
    volumes:
      - app_storage:/var/www/html/storage/app
      # Provider credentials for the agent runtime, operator-provisioned on
      # the host (chmod 600), mounted read-only into the agent's HOME.
      # Optional: without it the runtime serves health/models but tasks
      # fail with MODEL_UNAVAILABLE until credentials exist.
      - ./storage/oc-auth/auth.json:/home/agent/.local/share/opencode/auth.json:ro
    networks:
      - application
    healthcheck:
      # /global/health requires basic auth — the check script in the image
      # authenticates with the service's own OPENCODE_SERVER_* env.
      test: ["CMD", "node", "/usr/local/bin/healthcheck.mjs"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 256m
    env_file: [.env]
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./infrastructure/caddy/Caddyfile.selfhost:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./apps/owner-console/public:/srv/owner-console/public:ro
    networks:
      - proxy
      - application
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging
