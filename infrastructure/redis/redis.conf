# Redis 8 — shared server, per-project namespacing (prefixes, Phase 4).
# No public port (compose publishes nothing). Auth required.
bind 0.0.0.0
protected-mode yes
port 6379
# Auth is injected via command line (--requirepass $REDIS_PASSWORD) so the
# secret never lives in this committed file. No requirepass/user lines here.
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data
appendonly yes
appendfsync everysec
maxmemory 384mb
maxmemory-policy noeviction
activedefrag yes
hz 10
logfile ""
# NOTE: compose mounts this file read-only; the entrypoint wrapper
# (infrastructure/docker/redis-entrypoint.sh) substitutes the password from
# $REDIS_PASSWORD before exec. See docs/REDIS.md.
