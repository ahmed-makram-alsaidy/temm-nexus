# ─────────────────────────────────────────────────────────────────
# Platform CI (prepared in Phase 26L — NOT pushed by the phase).
#
# Guarantees (26L.1/26L.2):
#  - no private dependencies: no private repos, servers, credentials, or
#    production Supabase access; private test fixtures are not part of the
#    distribution and are simply absent here (they self-skip locally).
#  - AI tests run against the in-repo FakeAiProvider — no paid API.
# ─────────────────────────────────────────────────────────────────
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  owner-console-release-suite:
    name: Owner Console hermetic release suite (BLOCKING)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/owner-console
    services:
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: bcmath, intl, zip, gd, redis, pdo_pgsql, sockets
          coverage: none
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Run the hermetic release suite (phpunit-release.xml)
        run: vendor/bin/phpunit -c phpunit-release.xml --no-progress

  owner-console-tests:
    name: Owner Console full test suite (local fixtures required)
    runs-on: ubuntu-latest
    # The FULL suite (phpunit.xml) includes operator/gate-fixture tests
    # (gate-a/gate-b, control-plane demo database, live Redis) that only
    # pass on an operator workstation; without the fixtures they error and
    # cascade through the shared SQLite connection. The hermetic BLOCKING
    # gate is the release-suite job above. Classification and the exact
    # exclusion table: docs/TEST_CLASSIFICATION.md. This job stays visible
    # and non-blocking — not silently green.
    continue-on-error: true
    defaults:
      run:
        working-directory: apps/owner-console
    services:
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: bcmath, intl, zip, gd, redis, pdo_pgsql, sockets
          coverage: none
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Run tests (sqlite in-memory; FakeAiProvider)
        run: vendor/bin/phpunit --no-progress

  sdk-tests:
    name: SDK suites
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: js, dir: packages/backend-sdk-js, run: npm ci && npm test }
          - { name: php, dir: packages/backend-sdk-php, run: composer install --no-interaction && vendor/bin/phpunit --no-progress tests }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: matrix.name == 'js'
        with:
          node-version: 22
      - uses: shivammathur/setup-php@v2
        if: matrix.name == 'php'
        with:
          php-version: "8.4"
          coverage: none
      - name: Test ${{ matrix.name }}
        run: ${{ matrix.run }}
        working-directory: ${{ matrix.dir }}

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for credential-shaped material
        run: bash scripts/security/secret-scan.sh

  private-reference-scan:
    name: Private-reference scan (distribution)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package distribution artifact
        run: bash scripts/release/package-dist.sh ci-artifacts
      - name: Scan artifact for forbidden private references
        run: |
          ARTIFACT=$(ls ci-artifacts/*.tar.gz | head -1)
          bash scripts/release/private-ref-scan.sh "$ARTIFACT"
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-artifact
          path: ci-artifacts/*.tar.gz
          retention-days: 7

  script-tests:
    name: Infrastructure scripts (healthcheck, installer banner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fpm-healthcheck decision logic (stubbed FastCGI responses)
        run: bash scripts/tests/fpm-healthcheck.test.sh
      - name: install.sh dry-run banner
        run: bash scripts/tests/installer-banner.test.sh

  container-build:
    name: Production image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production application image
        run: docker build -f infrastructure/docker/prod/Dockerfile -t platform:ci .
      - name: Assert generated frontend assets ship in the image
        run: bash scripts/tests/prod-image-assets.test.sh platform:ci
      - name: Prepare .env for compose validation
        run: cp .env.example .env
      - name: Validate compose configuration
        run: docker compose -f docker-compose.prod.yml config --quiet

  fresh-install:
    name: Fresh-install smoke (install.sh -> setup gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the installer (real operator path)
        run: |
          if ! ./scripts/install.sh; then
            echo "== installer failed; service diagnostics =="
            docker compose -f docker-compose.prod.yml ps -a || true
            docker compose -f docker-compose.prod.yml logs --tail=200 migrate || true
            exit 1
          fi
      - name: Verify setup gate
        run: |
          for i in $(seq 1 60); do
            APP=$(docker compose -f docker-compose.prod.yml ps --format '{{.Name}} {{.Health}}' | grep ' app ' | grep -c healthy || true)
            [ "$APP" = "1" ] && break
            sleep 5
          done
          # Uninitialized platform redirects /setup to the wizard step 1;
          # following the redirect must land on a working page (200).
          CODE=$(curl -sL -o /dev/null -w '%{http_code}' http://localhost:80/setup)
          [ "$CODE" = "200" ] || {
            docker compose -f docker-compose.prod.yml logs --tail=120 app || true
            echo "== response body (first 2KB) =="
            curl -s http://localhost:80/setup | head -c 2000 || true
            echo ""
            echo "== laravel logs =="
            docker compose -f docker-compose.prod.yml exec -T app sh -c 'for f in storage/logs/*.log; do echo "== $f =="; tail -n 60 "$f"; done' || true
            echo "/setup returned $CODE — expected 200"
            exit 1
          }
          LOC=$(curl -s -o /dev/null -w '%{redirect_url}' http://localhost:80/)
          echo "root redirect target: $LOC"
          docker compose -f docker-compose.prod.yml ps
      - name: Verify edge asset delivery (Filament CSS/JS, Livewire)
        run: |
          set -e
          check() {
            local path="$1" mime="$2"
            local out size
            out=$(curl -s -o /dev/null -w '%{http_code} %{content_type}' "http://localhost:80${path}")
            size=$(curl -s "http://localhost:80${path}" | wc -c)
            echo "${path} -> ${out} (${size}B)"
            case "${out}" in
              "200 ${mime}"*) ;;
              *) echo "asset check failed for ${path} (expected 200 ${mime}); got: ${out}"; exit 1 ;;
            esac
            [ "${size}" -gt 512 ] || { echo "asset body suspiciously small: ${path}"; exit 1; }
          }
          check "/css/filament/filament/app.css" "text/css"
          check "/js/filament/filament/app.js" "application/javascript"
          check "/fonts/filament/filament/inter/index.css" "text/css"
          check "/css/cp.css" "text/css"
